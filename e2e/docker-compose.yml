version: '3.9'

services:
  e2e-tests:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    environment:
      - NODE_ENV=test
      - CI=true
      - E2E_API_PORT=8000
      - E2E_APP_PORT=3000
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/api/node_modules
      - /app/app/node_modules
      - /app/e2e/node_modules
      - ./playwright-report:/app/e2e/playwright-report
      - ./test-results:/app/e2e/test-results
    command: yarn test:e2e
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
