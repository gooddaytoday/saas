version: '3.9'

services:
  e2e-tests:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    environment:
      - NODE_ENV=test
      - CI=true
      - E2E_API_PORT=8000
      - E2E_APP_PORT=3000
    command: yarn test:e2e:ci
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
