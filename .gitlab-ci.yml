stages:
  - test

e2e-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.41.0-jammy
  timeout: 20 minutes
  before_script:
    - yarn install --frozen-lockfile
    - cd api && yarn install --frozen-lockfile && cd ..
    - cd app && yarn install --frozen-lockfile && cd ..
    - npx playwright install chromium
  script:
    - yarn test:e2e:ci
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
      - e2e/junit.xml
    reports:
      junit: e2e/junit.xml
    expire_in: 7 days
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - api/node_modules/
      - app/node_modules/
      - .yarn-cache/
  only:
    - main
    - develop
    - merge_requests

e2e-tests-docker:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  timeout: 20 minutes
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache docker-compose
  script:
    - cd e2e
    - docker-compose -f docker-compose.ci.yml up --build --abort-on-container-exit
    - docker-compose -f docker-compose.ci.yml down -v
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
    expire_in: 7 days
  only:
    - main
    - develop
    - merge_requests
